name: Temporary Avantio diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture encrypted Avantio sample 0
        shell: bash
        run: |
          set -euo pipefail
          url="https://pineapples-worker.morphia.workers.dev/_diagnostics/avantio-sample-20261005?slot=0"
          for attempt in $(seq 1 36); do
            code="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/avantio.json -w "%{http_code}" "$url" || true)"
            if [ "$code" = "200" ] && grep -q '"encoding":"gzip"' /tmp/avantio.json; then
              cat /tmp/avantio.json
              exit 0
            fi
            sleep 10
          done
          exit 1

